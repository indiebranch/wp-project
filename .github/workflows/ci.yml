name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: PHP checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: mbstring, dom, xml, xmlwriter
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run checks
        run: composer ci

      - name: Check command syntax
        run: |
          bash -n bin/build-release
          if [[ -f .ddev/commands/host/project ]]; then
            bash -n .ddev/commands/host/project
          fi
          if [[ -f .ddev/commands/host/sandbox ]]; then
            bash -n .ddev/commands/host/sandbox
          fi

      - name: Set up Node
        if: hashFiles('package.json', '.ddev/scripts/*.mjs', 'tests/Tooling/*.test.mjs') != ''
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}
          cache-dependency-path: package-lock.json

      - name: Check and test project tooling
        if: hashFiles('.ddev/scripts/*.mjs', 'tests/Tooling/*.test.mjs') != ''
        run: |
          shopt -s nullglob
          for script in .ddev/scripts/*.mjs; do node --check "$script"; done
          tooling_tests=(tests/Tooling/*.test.mjs)
          if (( ${#tooling_tests[@]} )); then
            node --test "${tooling_tests[@]}"
          fi

      - name: Build project assets
        if: hashFiles('package.json') != ''
        run: npm ci && npm run build

      - name: Verify production dependency installation
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
